services:
  backend:
    image: python:3.11-slim
    container_name: institutional-assistant-backend
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python3 server.py"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: institutional-assistant-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
